<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adventure Forever</title>
<style>
  body { font-family: ui-monospace, Menlo, monospace; background: #111; color: #ddd; margin: 16px; }
  canvas { image-rendering: pixelated; width: 640px; height: 456px; background: #000; display: block; }
  pre { font-size: 13px; line-height: 1.4; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; }
  #status { color: #9c9; }
  a { color: #9cf; }
</style>
</head>
<body>
<h3>Adventure Forever - the 2600 in the browser (Stella as WebAssembly)</h3>
<p>ROM: <input type="file" id="rom" accept=".a26,.bin"> &nbsp; <span id="status">loading core…</span></p>
<p>Arrows move, Space is the button, Enter is Reset (start), Shift is Select. Adventure only makes a sound when something happens: a pickup or drop, a dragon, the bat, the win. The looks: <a href="looks.html">looks.html</a>.</p>
<div class="row">
  <canvas id="screen" width="160" height="228"></canvas>
  <pre id="ram"></pre>
</div>
<script type="module">
import { Atari, demoJoy, romSource } from "./atari.js";

const status = document.getElementById("status");
const canvas = document.getElementById("screen");
const ramView = document.getElementById("ram");
const demo = new URLSearchParams(location.search).has("demo");

const atari = await Atari.create();
atari.attachKeyboard(); atari.attachSound();
status.textContent = "core ready - choose your adventure.a26";

let frames = 0, busy = 0, lastReport = performance.now(), total = 0;
function loop() {
  const start = performance.now();
  if (demo && total === 0) atari.wakeAudio();
  atari.run(demo ? demoJoy(total++) : atari.joyMask);
  atari.draw2600(canvas);
  ramView.textContent = atari.ramText();
  atari.playAudio();
  busy += performance.now() - start; frames++;
  if (start - lastReport > 1000) {
    status.textContent = `running: ${frames} frames/s, ${(busy / frames).toFixed(2)} ms of work per frame - ${atari.soundState}`;
    frames = 0; busy = 0; lastReport = start;
  }
  requestAnimationFrame(loop);
}

romSource(document.getElementById("rom"), (bytes) => {
  if (!atari.load(bytes)) { status.textContent = "the core refused that file"; return; }
  status.textContent = `loaded ${bytes.length} bytes`;
  requestAnimationFrame(loop);
});
</script>
</body>
</html>
